# Regenerates package-lock.json whenever package.json changes on main and
# commits it back. Exists because the development sandbox that writes most of
# this code cannot reach the npm registry; once it can, delete this workflow
# and commit lockfile changes directly.
name: Sync lockfile

on:
  push:
    branches: [main]
    paths: [package.json]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: lockfile
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - name: Resolve lockfile
        run: npm install --package-lock-only --no-audit --no-fund
      - name: Commit if changed
        run: |
          if git diff --quiet -- package-lock.json && git ls-files --error-unmatch package-lock.json >/dev/null 2>&1; then
            echo "Lockfile already in sync."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git commit -m "chore: sync package-lock.json"
          git push
